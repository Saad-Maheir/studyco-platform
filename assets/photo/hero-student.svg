<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#EBF4FF"/>
    <stop offset="100%" stop-color="#F5F8FF"/>
  </linearGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<!-- Terminal / Airport Silhouette -->
<rect x="50" y="200" width="700" height="300" fill="#D1D5DB" opacity="0.3" rx="20"/>
<path d="M100 250 H700 M100 320 H700 M100 390 H700" stroke="#9CA3AF" stroke-width="2" opacity="0.4"/>
<!-- Flight departure board graphic -->
<rect x="520" y="80" width="220" height="80" fill="#111111" rx="10"/>
<text x="540" y="115" font-family="Arial" font-size="16" font-weight="bold" fill="#F5B000">DEPARTURES ➔</text>
<text x="540" y="140" font-family="Arial" font-size="14" fill="#FFFFFF">MALAYSIA  GATE A2</text>
<!-- Student Character Vector -->
<circle cx="360" cy="180" r="70" fill="#FCD34D"/> <!-- Head -->
<path d="M 270 550 C 270 320, 450 320, 450 550 Z" fill="#1E40AF"/> <!-- Jacket -->
<!-- Yellow Backpack -->
<rect x="220" y="320" width="90" height="180" rx="30" fill="#F5B000"/>
<rect x="235" y="350" width="60" height="60" rx="10" fill="#D97706"/>
<!-- Passport in hand -->
<rect x="420" y="360" width="55" height="80" rx="5" fill="#1E3A8A"/>
<circle cx="447" cy="400" r="12" fill="#F5B000"/>
<text x="432" y="380" font-family="Arial" font-size="9" fill="#FFF">PASSPORT</text>
</svg>