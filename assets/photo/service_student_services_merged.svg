  <rect x="160" y="40" width="80" height="40" rx="12" fill="#D97706"/>
  <line x1="200" y1="110" x2="200" y2="240" stroke="#B45309" stroke-width="6"/>
  <circle cx="150" cy="265" r="10" fill="#111"/>
  <circle cx="250" cy="265" r="10" fill="#111"/>
  
  <!-- Passport Booklet -->
